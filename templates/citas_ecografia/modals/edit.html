<!-- Modal: Editar Cita de Ecografía -->
<div class="modal fade" id="modal-edit" tabindex="-1" role="dialog" aria-labelledby="editLabel">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editLabel">Editar Cita de Ecografía</h5>
            </div>

            <div class="modal-body">
                <div id="edit-alert" class="alert alert-danger d-none" role="alert"></div>

                <div class="form-group mb-3">
                    <label for="edit-paciente">Paciente:</label>
                    <input type="text" class="form-control" id="edit-paciente" readonly>
                </div>

                <div class="form-group mb-3">
                    <label for="edit-fecha">Fecha:</label>
                    <input type="date" class="form-control" id="edit-fecha" disabled>
                </div>

                <div class="form-group mb-3">
                    <label for="edit-medico">Ecógrafo:</label>
                    <input type="text" class="form-control" id="edit-medico" readonly>
                </div>

                <div class="form-group mb-3">
                    <label for="edit-hora">Hora:</label>
                    <input type="time" class="form-control" id="edit-hora" disabled>
                </div>

                <div class="form-group mb-3">
                    <label for="edit-estado">Estado:</label>
                    <select class="form-control" id="edit-estado">
                        <option value="PROGRAMADA">Programada</option>
                        <option value="REALIZADA">Realizada</option>
                        <option value="REPROGRAMADA">Reprogramada</option>
                    </select>
                </div>

                <div class="form-group mb-3">
                    <label for="edit-comentario">Comentario Médico:</label>
                    <textarea class="form-control" id="edit-comentario" rows="3" placeholder="Comentarios del médico"></textarea>
                </div>

                <div class="form-group mb-3">
                    <label for="edit-resultado">Resultado de Ecografía:</label>
                    <textarea class="form-control" id="edit-resultado" rows="3" placeholder="Resultado de la ecografía"></textarea>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" id="btn-update">Actualizar</button>
            </div>
        </div>
    </div>
</div>
