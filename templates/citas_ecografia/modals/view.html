<!-- Modal: Ver Detalles de Cita de Ecografía -->
<div class="modal fade" id="modal-view" tabindex="-1" role="dialog" aria-labelledby="viewLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="viewLabel">Detalles de la Cita</h5>
            </div>

            <div class="modal-body">
                <div class="view-content">
                    <p><strong>Paciente:</strong> <span id="view-paciente"></span></p>
                    <p><strong>CI:</strong> <span id="view-ci"></span></p>
                    <p><strong>Especialidad:</strong> <span id="view-especialidad"></span></p>
                    <p><strong>Médico:</strong> <span id="view-medico"></span></p>
                    <p><strong>Fecha:</strong> <span id="view-fecha"></span></p>
                    <p><strong>Hora:</strong> <span id="view-hora"></span></p>
                    <p><strong>Estado:</strong> <span id="view-estado"></span></p>
                    <p><strong>Comentario Médico:</strong> <span id="view-comentario"></span></p>
                    <p><strong>Resultado:</strong> <span id="view-resultado"></span></p>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>
