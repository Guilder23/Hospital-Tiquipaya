<!-- Modal: Agendar Nueva Cita de Ecografía -->
<div class="modal fade" id="modal-create" tabindex="-1" role="dialog" aria-labelledby="createLabel">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="createLabel">Nueva Cita de Ecografía</h5>
            </div>

            <div class="modal-body">
                <div id="create-alert" class="alert alert-danger d-none" role="alert"></div>

                <!-- Paso 1: Búsqueda de Paciente -->
                <div class="step" id="step-1">
                    <h6 data-step="1">Paso 1: Buscar Paciente</h6>
                    <div class="form-group mb-3">
                        <label for="search-input">Buscar por CI:</label>
                        <input type="text" class="form-control" id="search-input" placeholder="Ingrese CI o nombre del paciente">
                    </div>
                    <button type="button" class="btn btn-primary" id="btn-search">Buscar</button>
                </div>

                <!-- Paso 2: Seleccionar Paciente -->
                <div class="step d-none" id="step-2">
                    <h6 data-step="2">Paso 2: Paciente Seleccionado</h6>
                    <div class="patient-info">
                        <p><strong>Nombre:</strong> <span id="patient-names"></span></p>
                        <p><strong>CI:</strong> <span id="patient-ci"></span></p>
                        <p><strong>Especialidad Solicitada:</strong> <span id="patient-specialty"></span></p>
                        <p><strong>Ecografía Asignada:</strong> <span id="patient-ecografia"></span></p>
                        <p><strong>Comentario Médico:</strong> <span id="patient-comment"></span></p>
                    </div>
                    <div style="margin-top: 20px;">
                        <button type="button" class="btn btn-secondary" id="btn-back-search">Atrás</button>
                    </div>
                </div>

                <!-- Paso 3: Seleccionar Ecógrafo y Fecha -->
                <div class="step d-none" id="step-3">
                    <h6 data-step="3">Paso 3: Seleccionar Ecógrafo y Fecha</h6>
                    
                    <!-- Paso 3a: Seleccionar Ecógrafo -->
                    <div id="step-3a">
                        <div class="form-group mb-3">
                            <label for="select-doctor">Ecógrafo:</label>
                            <select class="form-control" id="select-doctor">
                                <option value="">Seleccione un ecógrafo</option>
                            </select>
                        </div>
                    </div>
                    
                    <!-- Paso 3b: Información del contrato del ecógrafo -->
                    <div id="step-3b" class="d-none">
                        <div class="alert alert-info mb-3">
                            <strong>Información del Ecógrafo:</strong><br>
                            <span id="eco-contrato-info"></span>
                        </div>
                        
                        <!-- Calendario de días disponibles -->
                        <div class="form-group mb-3 calendario-wrapper">
                            <label>Fechas Disponibles:</label>
                            <div id="calendario-container">
                                <!-- Calendario generado por JS -->
                            </div>
                        </div>
                    </div>
                    
                    <div style="margin-top: 20px;">
                        <button type="button" class="btn btn-secondary" id="btn-back-patient">Atrás</button>
                    </div>
                </div>

                <!-- Paso 4: Seleccionar Hora -->
                <div class="step d-none" id="step-4">
                    <h6 data-step="4">Paso 4: Seleccionar Hora</h6>
                    <div class="horarios-legend" aria-hidden="true">
                        <span class="legend-label">Estado:</span>
                        <span class="legend-pill free">Libre</span>
                        <span class="legend-pill busy">Ocupado</span>
                    </div>
                    <div id="horarios-container" class="horarios-grid">
                        <!-- Horarios disponibles -->
                    </div>
                    <input type="hidden" id="selected-hour">
                    <input type="hidden" id="selected-date">
                    <div style="margin-top: 20px;">
                        <button type="button" class="btn btn-secondary" id="btn-back-doctor">Atrás</button>
                    </div>
                </div>
            </div>

            <div class="modal-footer" style="display: flex; justify-content: space-between; gap: 10px;">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                <button type="button" class="btn btn-primary d-none" id="btn-confirm">Agendar Cita</button>
            </div>
        </div>
    </div>
</div>
