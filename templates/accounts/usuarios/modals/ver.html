<div id="modal-ver-usuario" class="modal usuario-crear" aria-hidden="true">
  <div class="modal-backdrop" data-close></div>
  <div class="modal-panel">
    <h3>Datos del usuario</h3>

    <div class="section">
      <h4>Datos generales</h4>
      <div class="form-grid">
        <div class="form-row"><label>Usuario</label><div id="v-username"></div></div>
        <div class="form-row"><label>Nombres</label><div id="v-nombres"></div></div>
        <div class="form-row"><label>Apellido paterno</label><div id="v-apellido-paterno"></div></div>
        <div class="form-row"><label>Apellido materno</label><div id="v-apellido-materno"></div></div>
        <div class="form-row"><label>Correo</label><div id="v-email"></div></div>
        <div class="form-row"><label>CI</label><div id="v-ci"></div></div>
        <div class="form-row"><label>Complemento</label><div id="v-complemento"></div></div>
        <div class="form-row"><label>Expedido</label><div id="v-expedido"></div></div>
        <div class="form-row"><label>Fecha de nacimiento</label><div id="v-nacimiento"></div></div>
        <div class="form-row"><label>Sexo</label><div id="v-sexo"></div></div>
        <div class="form-row"><label>Teléfono</label><div id="v-telefono"></div></div>
        <div class="form-row"><label>Celular</label><div id="v-celular"></div></div>
        <div class="form-row"><label>Dirección</label><div id="v-direccion"></div></div>
      </div>
    </div>

    <div class="section">
      <h4>Rol</h4>
      <div id="v-rol"></div>
    </div>

    <div id="v-medico" class="section" style="display:none;">
      <h4>Datos de médico</h4>
      <div class="form-grid">
        <div class="form-row"><label>Especialidad</label><div id="v-especialidad"></div></div>
        <div class="form-row"><label>Nº matrícula</label><div id="v-matricula"></div></div>
        <div class="form-row"><label>Consultorio</label><div id="v-consultorio"></div></div>
        <div class="form-row"><label>Turnos</label><div id="v-turnos"></div></div>
        <div class="form-row"><label>Días atención</label><div id="v-dias"></div></div>
      </div>
    </div>

    <div id="v-admision" class="section" style="display:none;">
      <h4>Datos de admisión</h4>
      <div class="form-grid">
        <div class="form-row"><label>Ventanilla</label><div id="v-ventanilla"></div></div>
        <div class="form-row"><label>Turnos</label><div id="v-turnosadm"></div></div>
      </div>
    </div>

    <div id="v-encargado" class="section" style="display:none;">
      <h4>Datos de encargado de admisión</h4>
      <div class="form-grid">
        <div class="form-row"><label>Ventanilla</label><div id="v-ventanillaenc"></div></div>
        <div class="form-row"><label>Turnos</label><div id="v-turnosenc"></div></div>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn-secondary" data-close>Cerrar</button>
    </div>
  </div>
</div>
