<div class="especialidades-editar" id="modal-edit" aria-hidden="true" role="dialog" aria-labelledby="modal-editar-titulo">
  <div class="modal-backdrop" data-close></div>
  <div class="modal-panel">
    <div class="modal-header">
      <h3 id="modal-editar-titulo">Editar Especialidad</h3>
      <button class="modal-close-btn" type="button" data-close aria-label="Cerrar modal">×</button>
    </div>
    <form method="POST" id="form-edit" class="modal-form">
      {% csrf_token %}
      <div class="form-row">
        <label for="editar-nombre">Nombre *</label>
        <input id="editar-nombre" name="nombre" type="text" required placeholder="Ingrese el nombre de la especialidad" maxlength="30" minlength="3" pattern="[A-Za-záéíóúÁÉÍÓÚñÑ\s]+" title="Mínimo 3 letras. Solo caracteres alfabéticos">
        <small class="char-limit">Mínimo 3 caracteres. Máximo 30</small>
      </div>
      <div class="form-row">
        <label for="editar-descripcion">Descripción</label>
        <textarea id="editar-descripcion" name="descripcion" placeholder="Ingrese una descripción (opcional)" maxlength="100" minlength="10" pattern="[A-Za-z0-9áéíóúÁÉÍÓÚñÑ\s.,;:¿?¡!()-]+" title="Mínimo 10 caracteres alfanuméricos"></textarea>
        <small class="char-limit">Mínimo 10 caracteres. Máximo 100</small>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" type="button" data-close>Cancelar</button>
        <button class="btn" type="submit">Guardar</button>
      </div>
    </form>
  </div>
</div>
