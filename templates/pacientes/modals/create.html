<div class="modal pacientes-crear" id="modal-crear-paciente" aria-hidden="true">
  <div class="modal-backdrop" data-close></div>
  <div class="modal-panel">
    <h3>Crear paciente</h3>
    <div class="form-alert alert-error" id="create-error" style="display:none"></div>
    <form method="post" action="/pacientes/nuevo/" id="form-create">
      {% csrf_token %}

      <div class="section">
        <h4>Datos Personales</h4>
        <div class="form-grid">
          <div class="form-row"><label>Nombres</label><input name="nombres" required minlength="3" maxlength="30" pattern="[A-Za-záéíóúÁÉÍÓÚñÑ\s]+" title="Mínimo 3 y maximo 30 caracteres alfabeticos" placeholder="Ej: Juan Carlos"></div>
          <div class="form-row"><label>Apellido paterno</label><input name="apellido_paterno" required minlength="3" maxlength="30" pattern="[A-Za-záéíóúÁÉÍÓÚñÑ\s]+" title="Mínimo 3 y maximo 30 caracteres alfabéticos" placeholder="Ej: Pérez"></div>
          <div class="form-row"><label>Apellido materno</label><input name="apellido_materno" minlength="3" maxlength="30" pattern="[A-Za-záéíóúÁÉÍÓÚñÑ\s]+" title="Mínimo 3 y maximo 30 caracteres alfabéticos" placeholder="Ej: García"></div>
          <div class="form-row"><label>CI</label><input name="ci" required minlength="7" maxlength="8" pattern="[0-9]{7,8}" title="Mínimo 7, máximo 8 dígitos" placeholder="Ej: 12345678"></div>
          <div class="form-row"><label>Complemento CI (opcional)</label><input name="ci_complemento" minlength="2" maxlength="4" pattern="[A-Za-z0-9]{2,4}" title="2 a 4 caracteres alfanuméricos" placeholder="Ej: 1A"></div>
          <div class="form-row"><label>Expedido</label>
            <select name="expedido">
              <option value="">-</option>
              <option value="LP">La Paz</option><option value="SC">Santa Cruz</option>
              <option value="CB">Cochabamba</option><option value="OR">Oruro</option>
              <option value="PT">Potosí</option><option value="TJ">Tarija</option>
              <option value="CH">Chuquisaca</option><option value="BE">Beni</option>
              <option value="PA">Pando</option>
            </select>
          </div>
          <div class="form-row"><label>Fecha de nacimiento</label><input name="fecha_nacimiento" type="date" max="{{ fecha_hoy }}" title="No se permiten fechas futuras"></div>
          <div class="form-row"><label>Sexo</label>
            <select name="genero"><option value="">-</option><option value="M">Masculino</option><option value="F">Femenino</option><option value="O">Otro</option></select>
          </div>
          <div class="form-row"><label>Nacionalidad</label><input name="nacionalidad" minlength="3" maxlength="30" pattern="[A-Za-záéíóúÁÉÍÓÚñÑ\s]+" title="Mínimo 3 y maximo 30 caracteres alfabéticos" placeholder="Ej: Boliviana"></div>
        </div>
      </div>

      <div class="section">
        <h4>Contacto</h4>
        <div class="form-grid">
          <div class="form-row"><label>Teléfono fijo (opcional)</label><input name="telefono_fijo" pattern="[0-9]{8}" title="Debe ser un número de 8 dígitos" placeholder="Ej: 44512345"></div>
          <div class="form-row"><label>Celular</label><input name="celular" pattern="[0-9]{8}" title="Debe ser un número de 8 dígitos" placeholder="Ej: 71234567"></div>
          <div class="form-row"><label>Email</label><input name="email" type="email" minlength="11" maxlength="30" pattern="[a-zA-Z0-9._%+-]+@gmail\.com" title="Debe ser un correo @gmail.com" placeholder="Ej: ejemplo@gmail.com"></div>
          <div class="form-row"><label>Zona</label><input name="zona" minlength="3" maxlength="30" pattern="[A-Za-z0-9áéíóúÁÉÍÓÚñÑ\s]+" title="Mínimo 3 y maximo 30 caracteres alfanuméricos" placeholder="Ej: Villa Pagador"></div>
          <div class="form-row"><label>Calle</label><input name="calle" minlength="3" maxlength="30" pattern="[A-Za-z0-9áéíóúÁÉÍÓÚñÑ\s]+" title="Mínimo 3 y maximo 30 caracteres alfanuméricos" placeholder="Ej: Avenida América"></div>
          <div class="form-row"><label>Número</label><input name="numero_domicilio" minlength="2" maxlength="6" pattern="[0-9]+" title="Mínimo 2 a 6 numeros" placeholder="Ej: 1234"></div>
          <div class="form-row form-row-full"><label>Dirección</label><input name="direccion" minlength="3" maxlength="30" pattern="[A-Za-z0-9áéíóúÁÉÍÓÚñÑ\s.,;:¿?¡!()-]+" title="Mínimo 3 y maximo 30 caracteres alfanuméricos" placeholder="Ej: Av. América #1234, Villa Pagador"></div>
        </div>
      </div>

      <div class="section">
        <h4>Seguro</h4>
        <div class="form-grid">
          <div class="form-row"><label>¿Tiene seguro?</label><select name="tiene_seguro" id="crear-tiene-seguro"><option value="False">No</option><option value="True">Sí</option></select></div>
          <div class="form-row"><label>Número de seguro</label><input name="numero_seguro" id="crear-numero-seguro" minlength="7" maxlength="11" pattern="[0-9]+" title="Debe contener solo números" placeholder="Ej: 12345678901"></div>
          <div class="form-row form-row-full" id="crear-tipo-seguro-row" style="display:none"><label>Tipo de seguro</label>
            <select name="tipo_seguro" id="crear-tipo-seguro">
              <option value="">Seleccione una opción</option>
              <option value="SUS">Sistema Único de Salud (SUS)</option>
              <option value="CNS">Caja Nacional de Salud (CNS)</option>
              <option value="CP">Caja Petrolera</option>
              <option value="SU">Seguro Universitario</option>
              <option value="CSSM">Corporación del Seguro Social Militar</option>
              <option value="CC">Caja de Caminos</option>
              <option value="CBPE">Cajas Bancarias Privada y Estatal</option>
              <option value="SHT">Seguro Hospital Tiquipaya</option>
              <option value="OTRO">OTRO</option>
            </select>
          </div>
        </div>
      </div>

      <div class="section">
        <h4>Contacto de Emergencia</h4>
        <div class="form-grid">
          <div class="form-row"><label>Nombre</label><input name="emergencia_nombre" minlength="3" maxlength="30" pattern="[A-Za-záéíóúÁÉÍÓÚñÑ\s]+" title="Mínimo 3 y maximo 30 caracteres alfabéticos" placeholder="Ej: María López"></div>
          <div class="form-row"><label>Teléfono</label><input name="emergencia_telefono" pattern="[0-9]{8}" title="Debe ser un número de 8 dígitos" placeholder="Ej: 78901234"></div>
          <div class="form-row"><label>Relación</label><input name="emergencia_relacion" minlength="3" maxlength="30" pattern="[A-Za-záéíóúÁÉÍÓÚñÑ\s]+" title="Mínimo 3 y maximo 30 caracteres alfabéticos" placeholder="Ej: Madre"></div>
        </div>
      </div>

      <div class="section">
        <h4>Documentos Médicos</h4>
        <div class="form-grid">
          <div class="form-row"><label>Número de Boleta del SUS (original)</label><input name="numero_boleta_sus" minlength="3" maxlength="11" pattern="[0-9]+" title="Debe contener solo dígitos" placeholder="Ej: 12345678"></div>
          <div class="form-row"><label>Número del Carnet de Historial Clínico (Boleta Azul)</label><input name="numero_carnet_historial" minlength="5" maxlength="5" pattern="[0-9]+" title="Debe contener solo dígitos" placeholder="Ej: 12345"></div>
          <div class="form-row"><label>Número de Boleta de Referencia (original)</label><input name="numero_boleta_referencia" minlength="3" maxlength="11" pattern="[0-9]+" title="Debe contener solo dígitos" placeholder="Ej: 98765432"></div>
          <div class="form-row"><label>Número de copias</label><input name="numero_copias" type="number" min="0" pattern="[0-9]+" title="Debe contener solo dígitos" placeholder="Ej: 2"></div>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn-secondary" type="button" data-close>Cerrar</button>
        <button class="btn" type="submit">Guardar</button>
      </div>

    </form>
  </div>
  </div>
