<div class="modal turnos-editar" id="modal-editar-turno" aria-hidden="true" style="display:none">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel">
        <h3>Editar Turno</h3>
        <form id="form-edit-turno" method="POST">
            {% csrf_token %}
            <input type="hidden" id="edit-id" name="id"> 
            <div class="section">
                <div id="edit-turno-error-message" style="display: none; padding: 10px; margin-bottom: 12px; background-color: #fee; border-left: 4px solid #e53e3e; border-radius: 4px; color: #c53030; font-size: 0.9rem;"></div>
                <div class="form-row full-width">
                    <label for="edit-nombre">Nombre del Turno</label>
                    <input type="text" id="edit-nombre" name="nombre" required minlength="3" maxlength="30" pattern="[A-Za-záéíóúÁÉÍÓÚñÑ\s]+" title="Mínimo 3 letras. Máximo 30 caracteres. Solo caracteres alfabéticos">
                    <small style="display:block; margin-top: 4px; color: #666; font-size: 0.8rem;">Mínimo 3 caracteres. Máximo 30</small>
                </div>
                <div class="form-grid">
                    <div class="form-row">
                        <label for="edit-hora_ini">Hora de Inicio</label>
                        <input type="time" id="edit-hora_ini" name="hora_ini" required>
                    </div>
                    <div class="form-row">
                        <label for="edit-hora_fin">Hora de Fin</label>
                        <input type="time" id="edit-hora_fin" name="hora_fin" required>
                    </div>
                </div>
                <small class="form-hint" style="display:block; margin-top: 8px; margin-bottom: 12px; color: #666; font-size: 0.85rem;">La hora de inicio debe ser menor que la hora de fin</small>
                <div class="form-row full-width">
                    <label for="edit-estado">Estado</label>
                    <select id="edit-estado" name="estado" required>
                        <option value="true">Habilitado</option>
                        <option value="false">Deshabilitado</option>
                    </select>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" type="button" data-close>Cancelar</button>
                <button class="btn" type="submit">Actualizar</button>
            </div>
        </form>
    </div>
</div>
